    <button id="tab-check" class="tab on" data-t="check">Check</button>
    <button id="tab-updates" class="tab"><span data-t="updates">Updates</span> <span id="updates-count" class="count" hidden></span></button>
    <button id="open-options" class="icon" title="Settings" aria-label="Settings">⚙</button>
  </nav>
</header>
<main>
  <section id="view-check">
    <div class="target"><span id="target-host" class="host"></span></div>
    <details id="listing-box">
      <summary data-t="listingNameLabel">Business name shown in the listing (optional)</summary>
      <input id="listing-name" type="text" maxlength="200" autocomplete="off">
      <p class="help" data-t="listingNameHelp"></p>
    </details>
    <button id="check-btn" class="primary" data-t="checkThisPage">Check this page</button>
    <p id="status" class="status" hidden></p>
    <div id="result"></div>
    <div id="result-actions" hidden>
      <button id="recheck" class="link" data-t="recheck">Check again (live)</button>
      <button id="open-full" class="link" data-t="openFullResult">Open full result</button>
    </div>
  </section>
  <section id="view-updates" hidden>
    <div id="alerts"></div>
    <h3 data-t="watchedSites">Watched sites</h3>
    <div id="watches"></div>
  </section>
</main>
