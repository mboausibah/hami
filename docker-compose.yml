# Production-style run: Hami API + discovery worker sharing one volume (SQLite DB, artifacts, models).
# Database and artifact storage are chosen by DATABASE_URL / STORAGE_URL (docs/architecture.md).
#   docker compose up            (a fresh clone needs nothing else; .env is optional)
# Reviewer token: HAMI_REVIEWER_TOKEN in .env, or generated on first start:
#   docker compose exec api cat /data/reviewer_token
# API and reviewer console: http://localhost:8000 (/review). Put HTTPS in front for public use (Phase 2).
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: hami:latest
    env_file:
      - path: .env
        required: false   # optional: a fresh clone works without .env
    environment:
      HAMI_DATA_DIR: /data
      HAMI_MODELS_DIR: /data/models
      HAMI_PROCESSED_DIR: /data/processed
      # Used only when the postgres profile is on (docker compose --profile postgres up); otherwise SQLite.
      HAMI_PG_URL: postgresql+psycopg://hami:${POSTGRES_PASSWORD:-hami-local-only}@postgres:5432/hami
      # Synthetic test sites inside the container (for scripts/e2e_check.py against this API).
      RUN_TESTSITES: "true"
      TESTSITE_PORT: "8100"
    ports:
      # Local only by default; on a server Caddy proxies to it (docs/DEPLOY.md). HAMI_BIND=0.0.0.0 to expose.
      - "${HAMI_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - hami-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # only with --profile postgres
    shm_size: "1gb"
    init: true
    restart: unless-stopped

  discovery:
    image: hami:latest
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false   # optional: a fresh clone works without .env
    environment:
      HAMI_DATA_DIR: /data
      HAMI_MODELS_DIR: /data/models
      HAMI_PROCESSED_DIR: /data/processed
      HAMI_PG_URL: postgresql+psycopg://hami:${POSTGRES_PASSWORD:-hami-local-only}@postgres:5432/hami
    command: ["python", "-m", "app.discovery.worker"]
    healthcheck:
      disable: true
    volumes:
      - hami-data:/data
    shm_size: "1gb"
    init: true
    restart: unless-stopped

  # Hosted-style database, one command away:  docker compose --profile postgres up
  # The API and worker switch to it automatically (HAMI_PG_URL). Not published on any port.
  # Copy existing SQLite data first:  docker compose --profile postgres run --rm api python -m app.db.transfer
  # On a server set POSTGRES_PASSWORD in .env (docs/DEPLOY.md).
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: hami
      POSTGRES_DB: hami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hami-local-only}
    volumes:
      - hami-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hami -d hami"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # HTTPS on a server:  HAMI_DOMAIN=hami.example.org docker compose --profile postgres --profile https up -d
  # Caddy obtains and renews the certificate; the API itself stays on 127.0.0.1 (docs/DEPLOY.md).
  caddy:
    image: caddy:2.10-alpine
    profiles: ["https"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      HAMI_DOMAIN: ${HAMI_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  hami-data: {}
  hami-pg: {}
  caddy-data: {}
  caddy-config: {}
